name: Build Cross-Platform Binaries

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

jobs:
  build:
    # Only run if the PR was actually merged (not just closed)
    if: github.event.pull_request.merged == true
    name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: geliana-linux-amd64
          - goos: windows
            goarch: amd64
            artifact_name: geliana-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            artifact_name: geliana-macos-amd64
          - goos: darwin
            goarch: arm64
            artifact_name: geliana-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          check-latest: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          go build -v -o build/${{ matrix.artifact_name }} ./cmd/geliana

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7
